name: build-windows-manual

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version"
        required: false
        default: "3.38.10"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Package artifact
        shell: pwsh
        run: |
          $src = "simple_live_app\build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            Write-Error "build output not found: $src"
            exit 1
          }
          Compress-Archive -Path "$src\*" -DestinationPath "SimpleLive-windows-x64.zip" -Force
          Get-Item "SimpleLive-windows-x64.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-windows-x64
          path: SimpleLive-windows-x64.zip
          retention-days: 3
